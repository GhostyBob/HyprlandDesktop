# Info for systemd
general {
  lock_cmd = pidof hyprlock || hyprlock
}


# Screensaver listener
listener {
  timeout = 300
  on-timeout = kitty --class screensaver -e /bin/cmatrix -sC blue & sleep 0.5 
  on-resume = pkill -x cmatrix
}

# Screen locking listener
listener {
  timout = 600
  on-timeout = hyprlock
}
